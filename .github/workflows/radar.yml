name: NATIVAGAS Radar Gratuito 24x7

on:
  schedule:
    - cron: '12,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nativagas-radar-lock
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar NATIVAGAS e notificar WhatsApp
        env:
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MIN_MATCH_ALERT: "65"
        run: python worker.py

      - name: Salvar histórico e vagas curadas no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_jobs.json vagas_curadas.json || true
          git diff --staged --quiet || git commit -m "Atualiza vagas curadas automaticamente"
          git pull --rebase origin main || true
          git push origin main
