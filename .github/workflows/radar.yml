name: NATIVAGAS Radar Gratuito 24x7

on:
  schedule:
    - cron: '12,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar NATIVAGAS e notificar WhatsApp
        env:
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MIN_MATCH_ALERT: "72"
        run: python worker.py

      - name: Salvar histórico e vagas curadas no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_jobs.json vagas_curadas.json || true
          git commit -m "Atualiza vagas curadas reais e histórico" || exit 0
          git push
          git add sent_jobs.json || true
          git commit -m "Atualiza historico de vagas enviadas" || exit 0
          git push
